[package]
name        = "credsync-server"
description = "Server-side credSync: pull pagination, command dedupe, scope-token validation, host forwarding"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lints]
workspace = true

[dependencies]
# The server owns the wire's other side; the protocol crate owns the wire itself.
credsync-protocol = { path = "../credsync-protocol", version = "0.0.1" }
serde_json = "1"

# Postgres. `tokio-postgres` rather than an ORM: the server owns two tables and four queries, and
# a query builder would hide the one thing worth reading — the SQL that the byte budget and the
# cursor walk depend on. MIT/Apache-2.0, inside the deny.toml allowlist (D-011).
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio          = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
# The integration tests run against a real Postgres, so they need a runtime to drive it.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
