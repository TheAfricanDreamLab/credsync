[package]
name        = "credsync-core"
description = "Sans-IO deterministic state machine for credSync clients: sync loop, outbox, cursors, conflict application"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lints]
workspace = true

[dependencies]
# The protocol crate owns the wire; this crate owns *when* to put something on it. Depending on
# it rather than redefining the request and response shapes keeps docs/spec.md law over exactly
# one definition of each.
#
# Nothing else may be added here without checking it against the sans-IO ban list. The CI job
# `core is sans-IO` greps this crate's whole dependency graph, so a transitive I/O crate fails
# the build rather than arriving quietly.
credsync-protocol = { path = "../credsync-protocol", version = "0.0.1" }
serde_json = "1"

[dev-dependencies]
# Property tests for the apply path. A dev-dependency only: `proptest` pulls `rand`, which is on
# the sans-IO ban list, and the CI graph check uses `--edges normal` so dev-deps are excluded by
# construction rather than by hope.
proptest = "1"
serde_json = "1"
