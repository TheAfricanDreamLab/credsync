[package]
name        = "credsync-sim"
description = "Deterministic simulation harness for credSync: fault injection, invariant checking, seed replay"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lints]
workspace = true

[dependencies]
# The simulator drives the REAL core against fake traits. That is the whole design: the same core
# bytes run here and in production, so a bug this finds is a bug a device would have hit.
credsync-core     = { path = "../credsync-core", version = "0.0.1" }
credsync-protocol = { path = "../credsync-protocol", version = "0.0.1" }

# Host documents in simulated snapshots and payloads.
serde_json = "1"
