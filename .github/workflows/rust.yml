# CS-1 CI: checks the CODE. The repo-hygiene gates live in repo.yml (DECISIONS.md D-019).
#
# These jobs are attached as required status checks on `main`. Weakening one to get a merge
# through is the single forbidden move in this repo - see CLAUDE.md section 3.
name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning that nobody sees becomes a warning that nobody fixes.
  RUSTFLAGS: "-D warnings"
  # RUSTFLAGS reaches rustc and NOT rustdoc, so without this line the `cargo doc` step below
  # emitted warnings and exited 0 - a gate that had never once gated. A broken intra-doc link
  # lived on main from CS-3 to CS-10 with every PR green (#44).
  RUSTDOCFLAGS: "-D warnings"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    # CS-14's integration tests run against a real Postgres, not a mock. The parts of that slice
    # worth testing are exactly the parts a mock would invent: bigserial allocating seq under
    # concurrent inserts, check constraints refusing a malformed row, and `WHERE scope =` isolating
    # a tenant. A mock agrees with whatever the code expected.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: credsync
          POSTGRES_PASSWORD: credsync
          POSTGRES_DB: credsync_test
        ports:
          - 5432:5432
        # Without this the job races the container and fails on connection refused roughly one run
        # in three, which reads like a flaky test and is not one.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # A second, isolated cluster for the migration tests (#63), which hold write transactions
      # open for tens of seconds on purpose.
      #
      # `changes_after` withholds rows whose inserting transaction may still be in flight (D-063)
      # and decides that from `pg_snapshot_xmin` -- the oldest transaction running anywhere in the
      # *cluster*, since transaction ids are cluster-wide. Measured at CS-17: a transaction held in
      # an unrelated database still made a committed row read back as 0 of 1. So a second database
      # would isolate nothing and a second cluster does. The liveness problem itself is #62.
      postgres-isolated:
        image: postgres:16
        env:
          POSTGRES_USER: credsync
          POSTGRES_PASSWORD: credsync
          POSTGRES_DB: credsync_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # No toolchain input: rust-toolchain.toml pins the exact version (D-021), and letting the
      # action override it would defeat the pin.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Toolchain matches the pin
        run: |
          pinned=$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)
          actual=$(rustc --version | awk '{print $2}')
          echo "  pinned: $pinned   actual: $actual"
          [ "$pinned" = "$actual" ] || { echo "FAIL: toolchain does not match rust-toolchain.toml"; exit 1; }

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        env:
          # The integration tests fail loudly when this is absent rather than skipping. A suite
          # that goes green on a machine that never ran it is worse than no suite.
          CREDSYNC_TEST_DATABASE_URL: postgres://credsync:credsync@localhost:5432/credsync_test
          CREDSYNC_TEST_ISOLATED_DATABASE_URL: postgres://credsync:credsync@localhost:5433/credsync_test
        run: cargo test --workspace --all-features

      - name: cargo doc
        # Docs are part of the deliverable for a library others are meant to adopt; a broken
        # intra-doc link is a defect like any other.
        run: cargo doc --workspace --no-deps --all-features

  sans-io:
    name: core is sans-IO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # DECISIONS.md D-002. This is the gate that keeps deterministic simulation possible.
      # A single I/O dependency reaching the core destroys replay silently: the simulator keeps
      # passing while quietly losing the ability to find anything.
      - name: No I/O crates in the credsync-core graph
        run: |
          tree=$(cargo tree -p credsync-core --edges normal --prefix none --no-dedupe)
          echo "$tree"
          fail=0
          for banned in tokio async-std smol reqwest hyper ureq rusqlite libsqlite3-sys \
                        mio socket2 getrandom rand std-time chrono time-core; do
            if echo "$tree" | grep -qE "^${banned} "; then
              echo "FAIL: '${banned}' is in the credsync-core dependency graph"
              fail=1
            fi
          done
          exit $fail

      # The graph check above cannot see `SystemTime::now()`, which needs no dependency at all.
      # One line, no Cargo.toml change, every test still green - and deterministic replay is gone.
      # The two checks are complements: one watches what the crate depends on, the other watches
      # what it writes. Added at CS-6 (#7).
      - name: No ambient world in the core's source
        run: ./scripts/check-sans-io.sh

  miri:
    name: miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Miri needs nightly, which rust-toolchain.toml deliberately does not pin (D-021 pins the
      # toolchain the code is *built* with; Miri is a checker, not a build target). Every cargo
      # call below therefore says `+nightly` explicitly, or it would pick up the pinned 1.98.0
      # and find no miri at all.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2

      - name: miri setup
        run: cargo +nightly miri setup

      # Two environment variables, both load-bearing.
      #
      # MIRIFLAGS=-Zmiri-disable-isolation: proptest calls std::env::current_dir() to locate its
      # failure-persistence file, and Miri's sandbox refuses getcwd. Without this the run aborts
      # with "unsupported operation" before testing anything - and an aborted gate looks a great
      # deal like a passing one. The flag relaxes the sandbox, NOT the undefined-behaviour
      # checking, which is the part being bought here.
      #
      # PROPTEST_CASES=2: Miri interprets rather than executes, roughly two orders of magnitude
      # slower, and that multiplies against the case count. The default 256 did not finish in
      # over an hour when measured at CS-7. This job is checking for undefined behaviour, not
      # searching the input space - the nightly job is where depth lives.
      - name: cargo miri test
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "2"
        run: cargo +nightly miri test -p credsync-core -p credsync-protocol

  fuzz-smoke:
    name: fuzz, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz needs nightly for -Zsanitizer. Same reasoning as the miri job: D-021 pins the
      # toolchain the code is *built* with, and a checker is not a build target.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Every wire-facing decoder has a target, checked by derivation rather than by a list that
      # somebody has to remember to update. It found four decoders the hand-written list had
      # missed on the day it was written.
      - name: every decoder is fuzzed
        run: ./scripts/check-fuzz-coverage.sh

      # Twenty seconds each, not the sixty the slice plan suggests. Eighteen targets at sixty is
      # eighteen minutes on every pull request, and a gate people route around because it is slow
      # is worse than a shorter one they keep. Depth lives in the nightly job, which runs fifteen
      # minutes per target against the same committed corpus.
      #
      # The smoke run's job is narrower and still worth having: catch a decoder that panics on
      # something shallow, on the commit that introduced it rather than the next morning.
      - name: fuzz every decoder
        run: ./scripts/fuzz.sh 20

      # The corpus is the accumulated coverage. A crash artifact is the bug report - it reproduces
      # with `cargo +nightly fuzz run <target> <file>` - so it is kept even when the job fails.
      - name: keep crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: credsync-protocol/fuzz/artifacts/
          if-no-files-found: ignore

  deny:
    name: licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # DECISIONS.md D-011: every dependency's licence is checked, and copyleft is a blocking
      # defect rather than a conversation. credSync is consumed as an ordinary dependency by
      # Dream Lab OS and MySaurify, so a GPL transitive would be inherited by both.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories

  crate-metadata:
    name: crate licence metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each crate is published individually, so each must carry its own licence declaration
      # and its own LICENSE/NOTICE files. Extraction to a separate repo then stays a `git mv`.
      - name: Every crate declares Apache-2.0 and carries LICENSE + NOTICE
        run: |
          fail=0
          for dir in credsync-* credsyncd; do
            [ -f "$dir/Cargo.toml" ] || continue
            if grep -qE 'license(\.workspace *= *true| *= *"Apache-2.0")' "$dir/Cargo.toml"; then
              echo "  ok    $dir  licence declared"
            else
              echo "  FAIL  $dir  no Apache-2.0 licence"; fail=1
            fi
            for f in LICENSE NOTICE; do
              if [ -e "$dir/$f" ]; then
                echo "  ok    $dir/$f"
              else
                echo "  FAIL  $dir/$f missing"; fail=1
              fi
            done
          done
          exit $fail
