# CS-0 CI: checks the REPO. rust.yml checks the CODE (DECISIONS.md D-019).
#
# Per-crate licence metadata is checked by rust.yml's `crate-metadata` job, not here: crates can
# inherit `license.workspace = true`, which a literal grep in this workflow got wrong at CS-1.
name: repo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  licence:
    name: licence and notice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Root LICENSE and NOTICE present
        run: |
          fail=0
          for f in LICENSE NOTICE; do
            if [ -f "$f" ]; then echo "  ok    $f"; else echo "  FAIL  $f missing"; fail=1; fi
          done
          exit $fail

      - name: LICENSE is Apache-2.0
        run: |
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache-2.0"; exit 1; }
          grep -q "Version 2.0" LICENSE     || { echo "LICENSE is not version 2.0"; exit 1; }
          echo "  ok    Apache-2.0"

      - name: NOTICE carries the trademark carve-out
        run: |
          grep -q "TRADEMARKS" NOTICE || { echo "NOTICE missing trademark section"; exit 1; }
          echo "  ok    trademark carve-out present"


  docs:
    name: docs and decision register
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decision register citations resolve
        run: ./scripts/check-decisions.sh

      # Regenerate from the .docx originals and fail if the result differs from what was
      # committed. Catches a hand-edited docs/*.md, which would silently diverge from source.
      - name: Generated docs match their sources
        run: |
          ./scripts/convert-docs.sh
          if ! git diff --quiet -- docs/; then
            echo "FAIL: docs/ differs from a fresh conversion of docs/source/"
            echo "Run ./scripts/convert-docs.sh and commit the result."
            git diff --stat -- docs/
            exit 1
          fi
          echo "  ok    docs match their sources"

      - name: Spec four-page ceiling
        run: |
          if [ ! -f docs/spec.md ]; then
            echo "  skip  spec.md not yet written (CS-2)"; exit 0
          fi
          # ~46 lines per page at the spec's formatting; the ceiling is a scope alarm (D-003).
          lines=$(wc -l < docs/spec.md)
          limit=190
          echo "  spec.md: $lines lines (limit $limit)"
          if [ "$lines" -gt "$limit" ]; then
            echo "FAIL: spec.md exceeds the four-page ceiling. Scope has crept - cut it."
            exit 1
          fi
          echo "  ok    within ceiling"
