# Deliberately its own workspace, not a member of credsync's.
#
# `cargo fuzz` builds with sanitizer and coverage flags (`-Zsanitizer=address`, sancov passes) and
# on a nightly toolchain. Pulling that into the main workspace would mean every ordinary
# `cargo build` resolved a nightly-only, sanitiser-instrumented crate, and `cargo deny` would audit
# `libfuzzer-sys` as though it shipped. It does not: this crate is never published and never linked
# into anything a device runs.
[workspace]

[package]
name = "credsync-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }

[dependencies.credsync-protocol]
path = ".."

[[bin]]
name = "batch"
path = "fuzz_targets/batch.rs"
test = false
doc = false
bench = false
